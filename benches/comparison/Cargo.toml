[package]
name = "sntrup-comparison"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: opt out of any enclosing workspace so this harness's pinned dependency
# versions (and its own Cargo.lock) never constrain the parent crate's resolution.
[workspace]

[dependencies]
criterion = "=0.8.1"
oqs = { version = "=0.11.0", default-features = false, features = ["ntruprime", "std"] }
pqcrypto-ntruprime = { version = "=0.1.6", default-features = false, features = ["std"] }
pqcrypto-traits = "=0.3.5"
rand = "0.10.0"
sntrup = { path = "../.." }

[[bench]]
name = "implementations"
harness = false

# clang 22 (Fedora 44) makes bindgen render OQS_SIG as an opaque type, and the generated
# layout assert for it fails to compile. This vendored copy only disables layout tests for
# the sig header (unused by this KEM-only bench); kem/common/rand bindings are unchanged.
[patch.crates-io]
oqs-sys = { path = "vendor/oqs-sys" }
