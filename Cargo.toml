[package]
authors = ["Michael Lodder <redmike7@gmail.com>"]
categories = ["algorithms", "cryptography"]
description = "Rust implementation of the Streamlined NTRU Prime KEM for all parameter sizes"
documentation = "https://docs.rs/crate/sntrup"
edition = "2024"
exclude = ["benches/comparison/**", "tests/**", ".github/**"]
keywords = ["cryptography", "hashing", "NTRU", "post-quantum"]
license = "MIT OR Apache-2.0"
name = "sntrup"
readme = "README.md"
repository = "https://github.com/mikelodder7/sntrup"
version = "0.4.0"

[features]
alloc = []
dcap = []
default = ["kgen", "ecap", "dcap"]
ecap = []
force-scalar = []
js = ["getrandom/wasm_js"]
# Implementations of the `kem` crate traits, covering all three operations at once.
kem = ["dep:kem", "dep:hybrid-array", "dep:rand_core", "kgen", "ecap", "dcap"]
kgen = []
serde = ["dep:serdect", "dep:serde"]
std = []

[dependencies]
getrandom = { version = "0.4", optional = true }
hex = "0.4"
hybrid-array = { version = "0.4.13", features = ["extra-sizes"], optional = true }
kem = { version = "0.3", optional = true }
rand = "0.10.0"
rand_chacha = "0.10.0"
rand_core = { version = "0.10", optional = true }
serde = { version = "1", optional = true, default-features = false }
serdect = { version = "0.4", optional = true }
sha2 = "0.11"
subtle = "2"
thiserror = "2.0"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[[example]]
name = "kem_traits"
path = "examples/kem_traits.rs"
required-features = ["kem"]

[[bench]]
harness = false
name = "mod"

[lints.rust]
missing_debug_implementations = "deny"
missing_docs = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unstable_features = "deny"
unused_extern_crates = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_parens = "deny"
unused_qualifications = "deny"

[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
mod_module_files = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_used = "deny"
